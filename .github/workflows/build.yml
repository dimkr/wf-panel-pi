name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git nodejs \
            debhelper meson ninja-build pkg-config dpkg-dev \
            wayland-protocols libwayland-dev \
            libgtk-layer-shell-dev libglib2.0-dev libgtk-3-dev \
            libwlroots-0.18-dev libglm-dev libudev-dev libdbusmenu-gtk3-dev \
            libevdev-dev libxml2-dev libmenu-cache-dev gettext libinput-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: meson setup builddir

      - name: Build
        run: meson compile -C builddir
